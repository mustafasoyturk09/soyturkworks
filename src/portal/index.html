<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#0b1321"><title>Soyturk Works</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/favicon.ico?v=3" sizes="16x16 32x32 48x48"><link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png"><link rel="stylesheet" href="/portal/portal.css"><script defer src="/portal/passkeys.js"></script><script defer src="/portal/portal.js"></script></head>
<body><div class="ambient" aria-hidden="true"></div><header class="topbar"><a class="brand" href="/"><img src="/assets/brand/sw-logo.png" alt=""><span>Soyturk<span>Works</span></span></a><div class="top-actions" id="topActions" hidden><a class="quiet-button" href="/companies">Firmalar</a><a class="quiet-button" href="/account">Hesabım</a><button class="quiet-button" id="logout" type="button">Çıkış yap <span aria-hidden="true">↗</span></button></div><span class="private-label" id="privateLabel"><i></i> ÖZEL ÇALIŞMA ALANI</span></header>
<main id="main"><div class="loading" role="status">Çalışma alanı hazırlanıyor…</div></main><footer class="site-footer"><span>SOYTURK WORKS</span><span>Finans ve muhasebe · Tek çalışma alanı</span></footer><div class="notice" id="notice" role="status" hidden></div>
<template id="loginTemplate"><div class="login-layout"><section class="intro"><div class="eyebrow"><span></span> SOYTURK WORKS</div><h1>Hoş Geldiniz,<br><em>Artık kontrol sizde..</em></h1><p>Soyturk Works ile finans ve muhasebe işlemlerinizi tek bir noktadan, kolayca takip edin.</p><div class="intro-rule"></div><div class="trust-list"><span><b>01</b> Firmaya özel işlemler</span><span><b>02</b> Parola ve cihazla güvenli giriş</span><span><b>03</b> Bilgisayar, tablet ve telefonda</span></div><div class="intro-mark" aria-hidden="true">SW<span>WORKSPACE</span></div></section><section class="login-card"><div class="card-topline"><span class="small-icon" aria-hidden="true">↗</span><span>ÇALIŞMA ALANINA GİRİŞ</span></div><h2 id="loginHeading">Tekrar hoş geldin.</h2><p class="subtext" id="loginDescription">Devam etmek için hesabına giriş yap.</p><form id="loginForm"><label>Kullanıcı adı<input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="40" placeholder="Kullanıcı adın"></label><label>Parola<input name="password" type="password" autocomplete="current-password" required maxlength="128" placeholder="Parolan"></label><div class="form-error" id="loginError" role="alert" hidden></div><button class="primary" type="submit">Giriş yap <span aria-hidden="true">→</span></button></form><button class="text-button forgot" id="forgot" type="button">Parolamı unuttum</button><div class="divider"><span>veya cihazınla devam et</span></div><button class="passkey-button" id="passkeyLogin" type="button"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 11a4 4 0 0 1 8 0v3a12 12 0 0 1-1 5M5 14v-3a7 7 0 0 1 14 0v3m-7-3v4a16 16 0 0 1-1 6m-3-7c0 3-.3 4.5-1 6m12-3-.5 3M4 5a11 11 0 0 1 16 0" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Parmak izi / Face ID ile giriş</button><p class="fineprint">Bu cihazda önceden kaydedilmiş bir geçiş anahtarı gerekir.</p></section></div></template>
<template id="companiesTemplate"><section class="company-heading"><h1>Çalışmak istediğiniz şirketi seçin</h1></section><a class="automation-entry" href="/takip"><span><strong>Otomatik Fatura Takibi</strong><small>Yeni faturalar, özel klasörler ve telefon bildirimleri.</small></span><b aria-hidden="true">↗</b></a><section class="company-grid" id="companyGrid" aria-label="Firma seçimi"></section><div class="company-bottom"><span><i></i> Her firma için ayrı çalışma alanı</span><button class="text-button" id="archiveButton" type="button">Kaldırılan firmalar</button></div></template>
<template id="accountTemplate"><section class="account-heading"><div class="eyebrow"><span></span> HESABIM</div><h1>Güvenlik ayarların.</h1><p>Parolanı ve giriş yapabildiğin cihazları buradan yönet.</p></section><div class="account-grid"><section class="settings-card"><h2>Hesap bilgileri</h2><dl><dt>Kullanıcı adı</dt><dd id="accountUsername"></dd><dt>Kurtarma e-postası</dt><dd id="accountEmail"></dd></dl><form id="passwordForm"><label>Mevcut parola<input name="currentPassword" type="password" autocomplete="current-password" required maxlength="128"></label><label>Yeni parola<input name="password" type="password" autocomplete="new-password" required minlength="7" maxlength="128"></label><label>Yeni parola tekrar<input name="confirmPassword" type="password" autocomplete="new-password" required minlength="7" maxlength="128"></label><p class="fineprint">En az 7 karakter. Değişiklik diğer açık oturumları kapatır.</p><button class="primary" type="submit">Parolayı güncelle</button></form></section><section class="settings-card"><h2>Parmak izi ve Face ID</h2><p class="subtext">Cihazının sunduğu parmak izi, yüz tanıma veya ekran kilidiyle giriş yapabilirsin.</p><form id="passkeyForm"><label>Cihaz adı<input name="name" placeholder="Örneğin: iPhone 15" required maxlength="60" autocomplete="off"></label><button class="passkey-button" type="submit">Bu cihazı kaydet <span aria-hidden="true">＋</span></button></form><div class="passkey-list" id="passkeyList"></div><p class="fineprint">Biyometrik verilerin cihazında kalır. Siteye parmak izi veya yüz görüntüsü gönderilmez.</p></section></div></template>
<dialog id="archiveDialog"><div class="dialog-header"><h2>Kaldırılan firmalar</h2><button type="button" id="closeArchive" class="quiet-button" aria-label="Kapat">✕</button></div><p>Firmanın kayıtları korunur. Geri getirerek yeniden açabilirsin.</p><div id="archiveList"></div></dialog>
</body></html>
